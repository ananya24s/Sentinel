<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark · Sentinel</title>
<link rel="icon" type="image/svg+xml" href="/static/brand/mark-flat.svg">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/site.css">
<script>document.documentElement.dataset.theme=(function(){var q=new URLSearchParams(location.search).get('theme');if(q==='light'||q==='dark')return q;try{return localStorage.getItem('sentinel.theme')}catch(e){return null}})()||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')</script>
<style>
.livebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 16px}
.prog{flex:1;min-width:180px;height:8px;border-radius:99px;background:var(--well);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sig);transition:width .15s}
.livemeta{font:400 13px var(--sans);color:var(--muted)} .livemeta b{color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile small{display:block;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.tile .big{font:700 30px var(--serif);color:var(--text)} .tile .big span{font-size:16px;color:var(--muted);font-weight:600}
.tile .vs{font:400 13px var(--sans);color:var(--muted);margin-top:4px} .tile .vs b{color:var(--text2);font-weight:600}
.tile .ref{font:400 12px var(--sans);color:var(--dim);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:16px}
.dots i{width:14px;height:14px;border-radius:3px;background:var(--well);border:1px solid var(--line)}
.dots i.ok{background:var(--safe);border-color:transparent} .dots i.bad{background:var(--sig);border-color:transparent}
.dotkey{font:400 12px var(--sans);color:var(--dim);margin-top:8px}
.errhead{font:400 14px/1.6 var(--sans);color:var(--text2);margin:0 0 14px;max-width:820px} .errhead b{color:var(--text)}
.errgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.errc{padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.errc h4{margin:0;font:600 14px var(--sans);display:flex;justify-content:space-between;gap:8px}
.errc h4 small{font:400 12px var(--sans);color:var(--dim);white-space:nowrap}
.errc .snip{font:400 12.5px/1.5 var(--mono);background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-word;max-height:110px;overflow:auto}
.errc .why{font:400 12.5px var(--sans);color:var(--muted)}
.errc .acts{display:flex;gap:8px;margin-top:auto}
.errc .doc{font:400 12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:280px;overflow:auto}
.errc .doc mark{background:rgba(255,90,54,.28);color:var(--text);border-radius:3px;padding:0 2px}
@media(max-width:860px){.tiles,.errgrid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <main>
    <h1 class="page">Benchmark</h1>
    <p class="lead">Every number here was produced by the scripts in the repository, on documents the models never trained on. Nothing on this page is typed in by hand.</p>
    <div id="out"><div class="empty"><span class="spin big"></span></div></div>
  </main>
  <div id="bot"></div>
</div>

<script src="/static/js/common.js"></script>
<script>
mountChrome(); pollHealth();
(async function () {
  const r = await (await fetch('/api/results')).json();
  const ab = r.final, ds = r.dataset || {}, el = $('#out');
  if (!ab) { el.innerHTML = '<div class="card empty"><h3>No results yet</h3><p>Run scripts/eval_rel.py to generate the benchmark tables.</p></div>'; return; }
  const cols = [['span_precision', 'Precision'], ['span_recall', 'Recall'], ['doc_injection_recall', 'Poisoned docs caught'], ['span_fpr', 'False-positive rate'], ['doc_fpr_benign_imperative', 'False alarms on harmless commands'], ['content_preservation', 'Content preserved']];
  const bar = v => `<div class="cell"><div class="tr"><i style="width:${Math.min(100, (v || 0) * 100)}%"></i></div><span>${pc(v)}</span></div>`;
  const table = (src, rows) => { let t = `<table class="res"><thead><tr><th>System</th>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>`; for (const [k, name, cls] of rows) { if (!src[k]) continue; t += `<tr class="${cls || ''}"><td>${name}</td>${cols.map(c => `<td>${bar(src[k][c[0]])}</td>`).join('')}</tr>`; } return t + '</tbody></table>'; };
  const main = table(ab, [['baseline', 'Baseline · tags + patterns'], ['scorer', 'Fast scorer (DeBERTa-v3-small)'], ['+boundary', '+ boundary rule'], ['sentinel', 'Sentinel · scorer + off-task check', 'full']]);
  const rw = ab.realweb ? table(ab.realweb, [['baseline', 'Baseline · tags + patterns'], ['scorer', 'Fast scorer'], ['sentinel', 'Sentinel', 'full']]) : '';
  const exp = table(ab, [['llm_judge', 'Scorer + small-LLM verifier (1.5B)'], ['llm_influence', 'Scorer + behavioural influence test (1.5B)'], ['llm_full', 'Scorer + verifier + influence']]);
  const fams = Object.keys(ab.baseline.recall_by_family);
  const famHtml = `<div class="fam">` + fams.map(f => `<div class="famrow"><span>${esc(f)}</span>${heat(ab.baseline.recall_by_family[f])}${heat(ab.scorer.recall_by_family[f])}${heat(ab.sentinel.recall_by_family[f])}</div>`).join('') + '</div>';
  const S = ab.sentinel, B = r.boundary || {};
  el.innerHTML = `<div class="kpis">
    <div class="kpi"><b>${ds.test ? ds.test.docs.toLocaleString() : '–'}</b><span>held-out test documents</span></div>
    <div class="kpi"><b>${fams.length}</b><span>attack families never seen in training</span></div>
    <div class="kpi"><b>${pc(S.doc_injection_recall)}</b><span>of poisoned documents caught (baseline ${pc(ab.baseline.doc_injection_recall)})</span></div>
    <div class="kpi"><b>${pc(S.span_precision)}</b><span>precision (baseline ${pc(ab.baseline.span_precision)})</span></div></div>
    <div class="card pad"><p class="lbl">Ablation · held-out test set</p>${main}
    <p class="note">Every row is scored on the same documents. The attack families in the test set appear in neither scorer training nor fusion calibration. “False alarms on harmless commands” is the share of documents containing a normal instruction-shaped sentence (recipes, manuals, admin emails, HTML comments) in which a harmless sentence was flagged.</p></div>
    <div id="live-sec"></div>
    ${rw ? `<h2 class="sh">Real web pages from sites never seen in training</h2><div class="card pad"><p class="lbl">Harvested public pages (docs, news, Wikipedia, blogs, READMEs) with attacks inserted</p>${rw}
    <p class="note">Real pages are messy: navigation, cookie banners, code samples, HTML comments. Test sites are held out by domain.</p></div>` : ''}
    <h2 class="sh">Boundary classification</h2>
    <div class="kpis"><div class="kpi"><b>${pc(B.channel_label_accuracy)}</b><span>channel labelled correctly</span></div><div class="kpi"><b>${pc(B.forged_marker_detection)}</b><span>forged role markers detected</span></div><div class="kpi"><b>${pc(B.normal_text_not_flagged)}</b><span>normal text not flagged</span></div><div class="kpi"><b>${B.cases || '–'}</b><span>hand-written cases (small; the rule is structural)</span></div></div>
    <h2 class="sh">What we tried and did not adopt</h2>
    <div class="card pad"><p class="lbl">Small local LLM as verifier / behavioural counterfactual (Qwen2.5-1.5B, evaluated on the first-round benchmark)</p>${exp}
    <p class="note">Our original idea was a behavioural counterfactual: run the agent with and without a span and see whether its behaviour moves off-task. With a 1.5B local model the agent mostly ignores injections, so with/without responses barely differ; the influence features received near-zero weight and hurt precision. The off-task signal that works is measured directly with sentence embeddings.</p></div>
    <h2 class="sh">Recall by held-out attack family</h2>
    <div class="card pad"><div class="famrow" style="background:none;margin-bottom:6px;max-width:420px"><span class="h" style="text-align:left">FAMILY</span><span class="h">BASE</span><span class="h">SCORER</span><span class="h">SENTINEL</span></div>${famHtml}</div>
    <div id="err-sec"></div>`;
  initLive(ab); initErrors();
})();

/* ---------- Re-run it live ---------- */
async function initLive(ab) {
  const box = $('#live-sec'); let docs = [];
  try { docs = await (await fetch('/api/benchmark/sample')).json(); } catch (e) { /* section is optional */ }
  if (!docs.length) return;
  const n = k => docs.filter(d => k === 'poisoned' ? d.kind === 'poisoned' : k === 'benign' ? d.kind === 'benign' : d.kind === 'clean').length;
  const S = ab.sentinel, B = ab.baseline;
  const tiles = [
    ['poisoned', 'Poisoned documents caught', `full test set: Sentinel ${pc(S.doc_injection_recall)} · baseline ${pc(B.doc_injection_recall)}`],
    ['benign', 'Harmless-command documents falsely flagged', `full test set: Sentinel ${pc(S.doc_fpr_benign_imperative)} · baseline ${pc(B.doc_fpr_benign_imperative)}`],
    ['clean', 'Clean documents falsely flagged', `full test set: Sentinel ${pc(S.doc_fpr_clean)} · baseline ${pc(B.doc_fpr_clean)}`]];
  box.innerHTML = `<h2 class="sh" id="live">Re-run it live</h2>
    <div class="card pad"><p class="note" style="margin:0">Don't take the table's word for it. This runs ${docs.length} documents drawn at random, with a fixed seed, from the held-out test set through the real pipeline, one request each, and counts the results as they come in. A sample this small can differ from the full-set numbers by several points.</p>
    <div class="livebar"><button class="btn" id="liverun">Run ${docs.length} documents</button><div class="prog"><i id="livebar"></i></div><span class="livemeta" id="livemeta">Not run yet</span></div>
    <div class="tiles">${tiles.map(t => `<div class="tile"><small>${t[1]}</small><div class="big" id="t-${t[0]}-s">–<span> / ${n(t[0])}</span></div><div class="vs">baseline <b id="t-${t[0]}-b">–</b> / ${n(t[0])}</div><div class="ref">${t[2]}</div></div>`).join('')}</div>
    <div class="dots" id="dots">${docs.map(() => '<i></i>').join('')}</div>
    <p class="dotkey">One square per document, for Sentinel: green = handled correctly, red = wrong. Hover a square for its family.</p></div>`;
  const dots = $$('#dots i'); docs.forEach((d, i) => dots[i].title = (d.family || (d.origin === 'realweb' ? 'real web page' : d.source)) + ' · ' + (d.kind === 'poisoned' ? 'poisoned' : d.kind === 'benign' ? 'harmless commands' : 'clean'));
  let ready = false, running = false; pollHealth(() => { ready = true; });
  $('#liverun').onclick = async () => {
    if (running) return; if (!ready) { $('#livemeta').textContent = 'The models are still loading. Try again in a few seconds.'; return; }
    running = true; const btn = $('#liverun'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Running…';
    const c = { poisoned: [0, 0], benign: [0, 0], clean: [0, 0] }, t0 = performance.now(); let done = 0, ms = 0;
    dots.forEach(d => d.className = '');
    for (let i = 0; i < docs.length; i++) {
      const r = await post('/api/benchmark/run', { id: docs[i].id });
      if (!r.ok) { $('#livemeta').textContent = 'Stopped: the server did not answer.'; break; }
      const j = r.data, k = j.kind, sOk = k === 'poisoned' ? j.sentinel.outcome === 'caught' : j.sentinel.outcome === 'passed', bOk = k === 'poisoned' ? j.baseline.outcome === 'caught' : j.baseline.outcome === 'passed';
      if (k === 'poisoned') { c.poisoned[0] += sOk; c.poisoned[1] += bOk; } else { c[k][0] += !sOk; c[k][1] += !bOk; }
      dots[i].className = sOk ? 'ok' : 'bad'; done++; ms += j.sentinel.ms || 0;
      for (const key of ['poisoned', 'benign', 'clean']) { $('#t-' + key + '-s').innerHTML = `${c[key][0]}<span> / ${n(key)}</span>`; $('#t-' + key + '-b').textContent = c[key][1]; }
      $('#livebar').style.width = (100 * done / docs.length) + '%';
      $('#livemeta').innerHTML = `<b>${done}</b> / ${docs.length} documents${performance.now() - t0 >= 2000 ? ' · ' + ((performance.now() - t0) / 1000).toFixed(0) + ' s' : ''} · ${Math.round(ms / done)} ms per document for Sentinel`;
    }
    running = false; btn.disabled = false; btn.textContent = 'Run again';
  };
  if (location.hash === '#live') { const w = setInterval(() => { if (ready) { clearInterval(w); $('#liverun').click(); } }, 400); }
}

/* ---------- Error explorer ---------- */
async function initErrors() {
  let E; try { const r = await fetch('/api/benchmark/errors'); if (!r.ok) return; E = await r.json(); } catch (e) { return; }
  const box = $('#err-sec'); let tab = 'misses';
  const hlText = (t, snip) => { const i = snip ? t.indexOf(snip) : -1; return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(snip) + '</mark>' + esc(t.slice(i + snip.length)); };
  const title = x => (x.kind === 'poisoned' ? x.family : x.kind === 'benign' ? 'Harmless commands' : 'Clean document') + (x.origin === 'realweb' ? ' · real web page' : ' · ' + x.source);
  function card(x, i) {
    const miss = tab === 'misses', snip = miss ? x.payload : (x.flagged[0] || '');
    const why = miss ? `The scorer gave it ${x.score === null ? 'a low score' : 'a score of ' + x.score.toFixed(2)}; the cut-off is ${E.thr ? E.thr.toFixed(2) : 'higher'}.` : `Nothing in this ${x.kind === 'benign' ? 'document is an attack (it contains normal commands)' : 'document is an attack'}, but Sentinel removed this text${x.flagged.length > 1 ? ' and ' + (x.flagged.length - 1) + ' more span' + (x.flagged.length > 2 ? 's' : '') : ''}.`;
    return `<div class="card errc"><h4><span>${esc(title(x))}</span><small>${miss ? 'missed attack' : 'false alarm'}</small></h4>
      <p class="why" style="margin:0">${miss ? 'The hidden instruction it missed:' : 'The text it flagged:'}</p><div class="snip">${esc(snip)}</div><p class="why" style="margin:0">${why}</p>
      <div class="acts"><button class="btn sm ghost" data-doc="${i}">Show document</button><button class="btn sm ghost" data-home="${i}">Open in Home</button></div><div id="edoc-${i}" hidden></div></div>`;
  }
  function draw() {
    const list = E[tab === 'misses' ? 'misses' : 'false_alarms'];
    $('#errlist').innerHTML = list.map(card).join('');
    $$('#errlist [data-doc]').forEach(b => b.onclick = () => { const i = +b.dataset.doc, d = $('#edoc-' + i), x = list[i]; if (d.hidden) { d.innerHTML = `<div class="doc">${hlText(x.text, tab === 'misses' ? x.payload : x.flagged[0])}</div>`; d.hidden = false; b.textContent = 'Hide document'; } else { d.hidden = true; b.textContent = 'Show document'; } });
    $$('#errlist [data-home]').forEach(b => b.onclick = () => { const x = list[+b.dataset.home]; try { sessionStorage.setItem('sentinel.load', JSON.stringify({ task: x.task, source: x.source, text: x.text, label: title(x) })); } catch (e) { /* ignore */ } location.href = '/'; });
  }
  box.innerHTML = `<h2 class="sh" id="errors">Where it fails</h2>
    <div class="card pad"><p class="errhead">On the ${E.test_docs.toLocaleString()} test documents, Sentinel misses <b>${E.n_misses} of ${E.poisoned_docs} poisoned documents</b> (it removes none of the hidden instruction) and falsely flags <b>${E.n_false_alarms} of ${E.harmless_docs} harmless ones</b>. Here are ${E.misses.length} examples of each, spread across families. Open any of them in Home to see it for yourself.</p>
    <div class="seg" id="errtab"><button data-v="misses" class="on">Missed attacks (${E.n_misses})</button><button data-v="false_alarms">False alarms (${E.n_false_alarms})</button></div>
    <div class="errgrid" id="errlist"></div></div>`;
  $('#errtab').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.v; $$('#errtab button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
}
</script>
</body>
</html>
